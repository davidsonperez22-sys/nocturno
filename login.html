<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicia sesión o regístrate en NOCTURNO.">
  <title>Acceso | NOCTURNO</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <header class="simple-header">
    <a class="brand" href="index.html">NOCTURNO</a>
    <a class="text-link" href="index.html">Volver al inicio</a>
  </header>

  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-heading">
        <span class="eyebrow">BIENVENIDO A LA NOCHE</span>
        <h1 id="authTitle">Inicia sesión</h1>
        <p id="authSubtitle">Continúa disfrutando tus películas favoritas.</p>
      </div>

      <div id="authMessage" class="form-message hidden"></div>

      <form id="authForm" novalidate>
        <div id="nameField" class="form-group hidden">
          <label for="name">Nombre</label>
          <input id="name" name="name" type="text" minlength="2" placeholder="Tu nombre" autocomplete="name">
        </div>
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" required placeholder="correo@ejemplo.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" required minlength="6" placeholder="Mínimo 6 caracteres" autocomplete="current-password">
        </div>
        <button id="authSubmit" class="btn btn-primary btn-block" type="submit">Iniciar sesión</button>
      </form>

      <div class="divider"><span>o</span></div>
      <button id="googleButton" class="btn btn-google btn-block" type="button">Continuar con Google</button>
      <button id="modeToggle" class="auth-toggle" type="button">¿No tienes cuenta? Regístrate</button>
    </section>
  </main>
  <script type="module" src="js/auth.js?v=2"></script>
</body>
</html>
