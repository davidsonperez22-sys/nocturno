<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Detalle y reproducción de películas en NOCTURNO.">
  <title>Película | NOCTURNO</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="movie">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Ir al inicio de NOCTURNO"><img class="brand-logo" src="nocturno-logo.svg" alt="NOCTURNO"></a>
    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">☰</button>
    <nav class="main-nav" id="mainNav"><a href="index.html">Inicio</a><a href="index.html#catalogo">Catálogo</a><a href="index.html#mi-lista">Mi lista</a><a id="adminLink" class="hidden" href="admin.html">Administración</a></nav>
    <div class="header-actions">
      <div class="profile-menu" id="profileMenu">
        <button id="profileButton" class="profile-trigger hidden" type="button" aria-label="Abrir perfil"><span id="profileAvatar" class="avatar avatar-small"></span><span id="userLabel" class="user-label"></span><span class="profile-chevron" aria-hidden="true">⌄</span></button>
        <div id="profilePanel" class="profile-panel hidden"><div class="profile-panel-heading"><span id="profileName">Usuario</span><small id="profileEmail"></small></div><div class="avatar-picker-title"><span>Elige tu avatar</span><span>NOCTURNO</span></div><div id="avatarChoices" class="avatar-grid"></div><button id="saveAvatarButton" class="btn btn-primary btn-small btn-block" type="button">Guardar avatar</button></div>
      </div>
      <div id="authActions"></div>
    </div>
  </header>
  <main id="movieDetailPage" class="detail-page"><div id="detailLoading" class="loading-state"><span class="spinner"></span> Cargando película...</div><section id="movieDetail" class="movie-detail hidden"></section></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/movies.js?v=3"></script>
  <script type="module" src="js/profile.js?v=1"></script>
</body>
</html>
